# Task configuration schema version
version = "2.0"
# Task metadata (author, difficulty, categorization)
[metadata]
author_name = "Etienne Diboti Lobe"
author_email = "diboti@comcast.net"
category = "machine-learning"
subcategories = []
difficulty = "hard"
codebase_size = "minimal"
number_of_milestones = 0
languages = ["python"]
tags = ["anomaly-detection", "fraud-detection", "sequence-modeling", "feature-engineering", "classification", "roc-auc", "time-series", "tabular-ml"]
expert_time_estimate_min = 40
junior_time_estimate_min = 100
# Verifier: runs the test script to check task completion
[verifier]
timeout_sec = 300.0
# Agent: limits how long the agent can run when attempting the task
[agent]
timeout_sec = 1200.0
# Sandbox environment limits
[environment]
allow_internet = false
build_timeout_sec = 600.0
cpus = 2
memory_mb = 3072
storage_mb = 4096
